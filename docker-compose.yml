version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: trycore_postgres
    environment:
      POSTGRES_USER: trycore_user
      POSTGRES_PASSWORD: trycore_password
      POSTGRES_DB: trycore_evm
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trycore_user -d trycore_evm"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
